steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mock-marketplace-api'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mock-marketplace-api'


  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mock-marketplace-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mock-marketplace-api'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,JWT_SECRET=change-me,JWT_EXPIRES_IN=1d,WEBHOOK_BASE_URL=https://YOUR_DOMAIN,WEBHOOK_TIMEOUT_MS=5000'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,INTERNAL_API_KEY=INTERNAL_API_KEY:latest'
images:
  - 'gcr.io/$PROJECT_ID/mock-marketplace-api'

options:
  logging: CLOUD_LOGGING_ONLY